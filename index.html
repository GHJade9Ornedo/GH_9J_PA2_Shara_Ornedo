<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <title>Tables and Images with bootstrap</title>
</head>
<body>
    <h2 class="text-center">Naruto Characters - Team 7</h2>
    <div class="row">
    <img class="rounded mx-auto d-block col-lg-4" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSXCX1IiHuMgK1vhX0WrHFAObwfl9O3ozk3mTAOC-HcBYWzYBzqt2ZGNWo&s=10" alt="Uchiha Sasuke" height="200px" with="350px">
    <img class="rounded-circle mx-auto d-block col-lg-4" src="https://wallpaperaccess.com/full/1527165.jpg" alt="Haruno Sakura" height="200px" with="350px">
    <img class="img-thumbnail mx-auto d-block col-lg-4" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRVjiyyzqS9bJXSTBWPRGgXXrOw7rM5RP9-NiTnmgR5oRNlUOOhsIc-hO4&s=10" alt="Uzumaki Naruto" height="200px" with="350px">
    </div>
    <h1 class="text-center">Bootstrap Table</h1>
    <img class="mx-auto d-block" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTok5jBzjQ1grPYfmDQWdVzyxnADkDcF-dOG_uKVrcAy44yWlcEIfvKpnE&s=10" alt="Spider-man" height="200px" width="350px">
    <table class="table table-bordered table-hover table-dark container">
        <tr>
            <th class="bg-danger" scope="col">Name</th>
            <th class="bg-danger" scope="col">Fav Anime</th>
            <th class="bg-danger" scope="col">Protagonist</th>
        </tr>
        <tr>
            <td>Shara S. Ornedo</td>
            <td>One piece</td>
            <td><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQrSbCJYdi0gL_mSL2imbHSmJiSdQhKb_LSUIXeDaW4hvbEGaVVoiMOMQMw&s=10" alt="Mihawk" height="200" width="220"></td>
        </tr>
        <tr>
            <td>Ave A. Ala</td>
            <td>JJK</td>
            <td><img src="https://static.wikia.nocookie.net/jujutsu-kaisen/images/e/e6/Toji_running_with_Playful_Cloud_%28Anime%29.png/revision/latest?cb=20231102213151" alt="Toji" height="200" width="350"></td>
        </tr>
        <tr>
            <td>Elaina Daclan</td>
            <td>Chainsaw Man</td>
            <td><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQYZPqWPUuK8ILB04eVu84UoyqH2_i_Qh7UHyXb45TnFA&s=10" alt="Yoru" height="200" width="350"></td>
        </tr>
        <tr>
            <td>Jamsed Junaid</td>
            <td>Tokyo Revengers</td>
            <td><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ_ROLl5Oq2iKhFBt-AHsPq0x8k9ZwG2Go07y3Avvi7IJTlpSvfM5Ae37pz&s=10" alt="Mikey" height="200" width="250"></td>
        </tr>
    </table>
</body>
</html>
